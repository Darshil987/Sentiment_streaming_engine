<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sentiment Streaming Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f4f6f8;
      color: #222;
    }
    h1 {
      margin-bottom: 8px;
    }
    .stats {
      display: flex;
      gap: 16px;
      margin: 16px 0 24px;
      flex-wrap: wrap;
    }
    .card {
      background: white;
      padding: 16px;
      border-radius: 10px;
      min-width: 140px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .feed {
      background: white;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-height: 500px;
      overflow-y: auto;
    }
    .item {
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }
    .item:last-child {
      border-bottom: none;
    }
    .positive { color: green; font-weight: bold; }
    .negative { color: crimson; font-weight: bold; }
    .neutral { color: #666; font-weight: bold; }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #0b5ed7;
      color: white;
      cursor: pointer;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <h1>Real-Time Sentiment Streaming Dashboard</h1>
  <p>Go handles streaming and WebSocket updates. Rust performs sentiment scoring.</p>

  <button onclick="startStream()">Start Stream</button>

  <div class="stats">
    <div class="card"><strong>Total</strong><div id="total">0</div></div>
    <div class="card"><strong>Positive</strong><div id="positive">0</div></div>
    <div class="card"><strong>Negative</strong><div id="negative">0</div></div>
    <div class="card"><strong>Neutral</strong><div id="neutral">0</div></div>
  </div>

  <div class="feed" id="feed"></div>

  <script>
    const feed = document.getElementById("feed");

    function updateStats(stats) {
      document.getElementById("total").textContent = stats.total;
      document.getElementById("positive").textContent = stats.positive;
      document.getElementById("negative").textContent = stats.negative;
      document.getElementById("neutral").textContent = stats.neutral;
    }

    function addResult(result) {
      const div = document.createElement("div");
      div.className = "item";

      const sentimentClass =
        result.sentiment === "Positive"
          ? "positive"
          : result.sentiment === "Negative"
          ? "negative"
          : "neutral";

      div.innerHTML = `
        <div><strong>Message #${result.id}</strong> processed by Worker ${result.worker_id}</div>
        <div>${result.text}</div>
        <div class="${sentimentClass}">${result.sentiment} (Score: ${result.score})</div>
        <div>Positive matches: ${result.positive_matches.join(", ") || "-"}</div>
        <div>Negative matches: ${result.negative_matches.join(", ") || "-"}</div>
      `;

      feed.prepend(div);
    }

    async function startStream() {
      await fetch("http://localhost:8080/stream/start", { method: "POST" });
    }

    const socket = new WebSocket("ws://localhost:8080/ws");

    socket.onmessage = function(event) {
      const payload = JSON.parse(event.data);

      if (payload.stats) {
        updateStats(payload.stats);
      }

      if (payload.type === "result" && payload.result) {
        addResult(payload.result);
      }
    };
  </script>
</body>
</html>
